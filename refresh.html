<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#382C24">
  <title>Refreshing Sundō…</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF6EC;color:#382C24;font:16px system-ui,sans-serif}main{text-align:center;padding:2rem}strong{font-size:1.2rem}</style>
</head>
<body>
  <main><strong>Refreshing Sundō…</strong><p>Clearing the old offline copy and opening the latest meal plan.</p></main>
  <script>
    (async () => {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      } catch (_) {
        // Continue to the cache-busted app even where cache APIs are unavailable.
      }
      location.replace('./?updated=mob-brothy-rice-v7');
    })();
  </script>
</body>
</html>
